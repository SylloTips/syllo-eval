name: CI

on:
  push:
    branches: [development]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx install poetry==1.8.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: poetry
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy syllo_eval --check-untyped-defs --explicit-package-bases
