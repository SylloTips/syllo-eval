services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: pg-syllo-eval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pg-syllo-eval']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '5432:5432'
    volumes:
      - syllo-eval-db:/var/lib/postgresql

  # The HTTP API; the same image runs the CLI: `docker compose run --rm syllo-eval syllo-eval --help`.
  syllo-eval:
    build: .
    image: syllo-eval
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '8005:8005'

  # Applies pending migrations once, then exits; the API starts only after it succeeds.
  migrate:
    extends: syllo-eval
    command: ['alembic', 'upgrade', 'head']
    depends_on: !override
      db:
        condition: service_healthy
    ports: !reset []

volumes:
  syllo-eval-db:
