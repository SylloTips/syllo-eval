name: syllo-eval-experiments

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-syllo-eval-paper}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in experiments/.env}
    configs:
      - source: create-phoenix-db
        target: /docker-entrypoint-initdb.d/create-phoenix-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - db:/var/lib/postgresql

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    volumes:
      - qdrant:/qdrant/storage

  phoenix:
    image: arizephoenix/phoenix:version-20.19.0
    environment:
      PHOENIX_POSTGRES_HOST: db
      PHOENIX_POSTGRES_USER: postgres
      PHOENIX_POSTGRES_PASSWORD: ${DB_PASSWORD}
      PHOENIX_POSTGRES_DB: phoenix
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:6006:6006'
      - '127.0.0.1:4317:4317'

  experiments:
    build:
      context: ..
      dockerfile: experiments/Dockerfile
    profiles: [cli]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-syllo-eval-paper}
      DB_PASSWORD: ${DB_PASSWORD}
      PHOENIX_BASE_URL: http://phoenix:6006
      QDRANT_URL: http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./data:/app/experiments/data
      - ./outputs:/app/experiments/outputs

configs:
  # Runs only when the db volume is first created.
  create-phoenix-db:
    content: CREATE DATABASE phoenix;

volumes:
  db:
  qdrant:
