[tool.poetry]
name = "syllo-eval-experiments"
version = "0.1.0"
description = "Experiments of the paper \"Evaluating Enterprise Agents From the Traces They Leave\""
authors = ["Lorenzo Antonelli <lorenzo.antonelli@syllotips.com>", "Andrea Rossi <andrea.rossi@syllotips.com>"]
license = "MIT"
readme = "README.md"
# The modules live directly in this folder, which is the import root.
packages = [
  {include = "ablation_metrics.py"},
  {include = "agents"},
  {include = "benchmarks"},
  {include = "cli.py"},
  {include = "collect.py"},
  {include = "config.py"},
  {include = "deepeval_baseline.py"},
  {include = "deepeval_env.py"},
  {include = "indexing"},
  {include = "search_tool"},
  {include = "judge.py"},
  {include = "manifest.py"},
  {include = "run_outputs.py"},
  {include = "service.py"},
]
# Read or run at run time from beside config.py, so they must ship in the wheel as well. The tau2 runtime runs in its own
# environment (scripts/setup-tau2.sh).
include = [
  {path = "prompts/*.md", format = ["sdist", "wheel"]},
  {path = "tau2_runtime/*", format = ["sdist", "wheel"]},
]

[tool.poetry.scripts]
syllo-exp = "cli:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
syllo-eval = {path = "..", develop = true}
httpx = "^0.28.1"
psycopg = "^3.3.3"
pyarrow = "^21.0.0"
pyyaml = "^6.0"
deepeval = "4.2.6"
qdrant-client = "^1.19.1"
fastmcp = ">=2.12.5,<3"

[tool.poetry.group.migrations.dependencies]
alembic = "^1.18.5"
sqlalchemy = "^2.0.36"

[tool.poetry.group.dev.dependencies]
mypy = "1.14.1"
types-pyyaml = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = true
exclude = ["\\.venv"]

# DeepEval's pytest plugin would import DeepEval before deepeval_env sets its switches. The suite runs with unittest.
[tool.pytest.ini_options]
addopts = "-p no:deepeval"
